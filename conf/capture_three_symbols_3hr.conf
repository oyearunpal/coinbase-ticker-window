# 3-hour capture for three symbols: BTC-USD, ETH-USD, SOL-USD
# Duration: 10800s = 3 hours
[feed]
endpoint = "wss://ws-feed.exchange.coinbase.com"
symbols  = ["BTC-USD", "ETH-USD", "SOL-USD"]
duration = 10800s
[window]
length = 300s
policy = "hybrid_histogram"
[output]
dir = "logs/capture_three_symbols_3hr"
[cpu]
pin = "shared_l3"
[capture]
record = "captures/three_symbols_3hr.bin"
