# Default configuration for ticker_feed / ticker_bench.
# See README.md for the full key reference. Every key below is optional
# except [feed] symbols; the values shown are the built-in defaults, with
# the default scenario (BTC-USD/ETH-USD/SOL-USD, 5-minute window)
# spelled out explicitly rather than left implicit.
#
# CLI overrides of the form --section.key=value take precedence over
# whatever is in this file, so a sweep can be scripted without editing
# configs.

[feed]
endpoint = "wss://ws-feed.exchange.coinbase.com"
symbols  = ["BTC-USD", "ETH-USD", "SOL-USD"]   # whole-cent products only (quote_increment 0.01)
duration = 600s          # 0 = run until SIGINT

[window]
length        = 300s            # the sliding window length -- a runtime value,
                                  # not a template parameter, so 300s and 3600s
                                  # exercise identical code (see docs/DESIGN.md)
policy        = "hybrid_histogram"   # the default at any window length; any policy
                                     # name from docs/policies.md works here

[output]
dir            = "logs"         # each run gets its own logs/<YYYYMMDD_HHMMSS>_<pid>/ inside
flush_interval = 200ms

[cpu]
pin         = "shared_l3"   # shared_l3 | smt_siblings | explicit | none
feed_core   = -1             # -1 = auto-select from /sys topology
writer_core = -1

[capture]
record = ""   # path to write raw WS frames verbatim, or "" to disable
replay = ""   # path to replay frames from instead of connecting live
